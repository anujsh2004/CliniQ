# Render Blueprint: the Spring Boot API with its Postgres and Redis.
# RabbitMQ has no Render-managed offering, so the reminder listener is off by
# default; point SPRING_RABBITMQ_ADDRESSES at a hosted broker and set
# RABBITMQ_LISTENER_ENABLED=true to turn it on.
databases:
  - name: cliniq-db
    plan: free
    databaseName: clinic_db
    user: clinic_user
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: cliniq-redis
    plan: free
    ipAllowList: []

  # The no-show risk and condition-hint models (ml-service/). Small enough for
  # the free 512 MB instance: the trained models are under 1.5 MB and are baked
  # into the image. Free services sleep when idle, so the first request after a
  # quiet spell can miss the backend's short ML timeout and the schedule loads
  # without badges until the service has woken. That is by design: ML is a hint,
  # never a reason for the schedule to fail.
  - type: web
    name: cliniq-ml
    runtime: docker
    plan: free
    rootDir: ml-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

  - type: web
    name: cliniq-backend
    runtime: docker
    plan: free
    rootDir: clinic-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: cliniq-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: cliniq-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: cliniq-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: cliniq-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: cliniq-db, property: password }
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: cliniq-redis, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: cliniq-redis, property: port }
      - key: CLINIC_JWT_SECRET
        generateValue: true
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RABBITMQ_LISTENER_ENABLED
        value: "false"
      # No-show risk and condition hints, from the cliniq-ml service above.
      # The public address, not Render's internal host:port: a free web service
      # does not receive private-network traffic, so the internal address left
      # every call failing and the schedule without hints. If the service is
      # ever recreated under another name, update this URL.
      - key: CLINIC_ML_ENABLED
        value: "true"
      - key: CLINIC_ML_URL
        value: https://cliniq-ml-v62a.onrender.com
      # Creates the demonstration accounts listed in the README on an empty
      # database. They share one published password: turn this off, or change
      # CLINIC_DEMO_PASSWORD, before real patients use the site.
      - key: CLINIC_DEMO_DATA_ENABLED
        value: "true"
      # The free instance has 512 MB; keep the heap inside it.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC
