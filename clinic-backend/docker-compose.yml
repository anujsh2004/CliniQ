services:
  postgres:
    image: postgres:16
    container_name: clinic-postgres
    environment:
      POSTGRES_DB: clinic_db
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_pass
      TZ: Asia/Kolkata
    ports:
      - "5433:5432"
    volumes:
      - clinic_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: clinic-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: clinic_user
      RABBITMQ_DEFAULT_PASS: clinic_pass
    ports:
      # 5672 for the app, 15672 for the management UI.
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clinic-redis
    ports:
      # 6380 on the host: 6379 is commonly taken by another local project,
      # the same reason Postgres sits on 5433.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clinic_pg_data:
