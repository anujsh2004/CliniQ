spring:
  application:
    name: clinic-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinic_db}
    username: ${DB_USERNAME:clinic_user}
    password: ${DB_PASSWORD:clinic_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Kolkata'

  jpa:
    # Flyway owns the schema; Hibernate only verifies that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2s
      # A cache is a convenience, not a dependency: if Redis is slow to answer,
      # fail fast and read from the database instead of holding the request.
      connect-timeout: 2s

  cache:
    type: redis
    redis:
      time-to-live: ${CLINIC_CACHE_TTL:10m}
      cache-null-values: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:clinic_user}
    password: ${RABBITMQ_PASSWORD:clinic_pass}
    listener:
      simple:
        # A delivery that keeps failing is retried with backoff and then dead
        # lettered, rather than spinning forever and starving the queue.
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 4
          multiplier: 2.0

clinic:
  jwt:
    # Dev-only fallback. Production injects CLINIC_JWT_SECRET from the secret
    # store; secrets are never committed (API contract section 19).
    secret: ${CLINIC_JWT_SECRET:dev-only-secret-change-me-in-every-real-environment}
    access-token-seconds: ${CLINIC_JWT_ACCESS_SECONDS:3600}
    refresh-token-seconds: ${CLINIC_JWT_REFRESH_SECONDS:604800}

  slots:
    # How far ahead bookable slots are materialised from recurring availability.
    # The API contract does not fix this (product-description.md 22, open
    # question 2), so it is configurable per environment.
    generation-horizon-days: ${CLINIC_SLOT_HORIZON_DAYS:30}
    # Nightly top-up of the rolling window, plus expiry of past slots.
    generation-cron: ${CLINIC_SLOT_GENERATION_CRON:0 30 1 * * *}

  notifications:
    # Hourly rather than daily, so an appointment booked late still gets its
    # reminder. A unique index makes the repetition harmless.
    reminder-cron: ${CLINIC_REMINDER_CRON:0 0 * * * *}

  payments:
    razorpay:
      # With no key id the application falls back to the stub gateway, so the
      # booking-to-payment flow runs locally without Razorpay credentials.
      # Production injects all three from the secret store.
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:dev-only-webhook-secret-change-me}
      api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Endpoints grouped in the order a reader meets them, rather than
    # alphabetically.
    tags-sorter: alpha
    operations-sorter: method

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.clinic: DEBUG
